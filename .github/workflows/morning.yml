name: Morning Brief
on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-morning-brief:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run morning brief
        run: |
          python scripts/morning_brief.py
          
     - name: Push to WeChat
       if: success()
       env:
         SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
       run: |
         REPORT_FILE=$(ls reports/morning_brief_*.md | tail -n 1)
         TITLE="AI A股晨报已生成"
         CONTENT=$(cat "$REPORT_FILE" | head -c 3500)

         curl -s "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
           -d "title=${TITLE}" \
           --data-urlencode "desp=${CONTENT}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: morning-report
          path: reports/
