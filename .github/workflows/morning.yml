name: Morning Brief

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-morning-brief:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run morning brief
        run: |
          python scripts/morning_brief.py

      - name: Push to WeChat
        if: success()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sendkey = os.environ.get("SERVERCHAN_SENDKEY", "")
          if not sendkey:
              print("SERVERCHAN_SENDKEY is empty")
              sys.exit(1)

          report_files = sorted(Path("reports").glob("morning_brief_*.md"))
          if not report_files:
              print("No morning brief report found")
              sys.exit(1)

          report_file = report_files[-1]
          content = report_file.read_text(encoding="utf-8", errors="ignore")

          # Server酱正文不要太长，先截取前 3000 个中文字符
          content = content[:3000]

          # 清理少数控制字符
          content = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", content)

          title = "AI A股晨报已生成"

          data = urllib.parse.urlencode({
              "title": title,
              "desp": content,
          }).encode("utf-8")

          url = f"https://sctapi.ftqq.com/{sendkey}.send"

          req = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded; charset=utf-8"
              },
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=20) as resp:
              body = resp.read().decode("utf-8", errors="ignore")
              print(body)

          try:
              payload = json.loads(body)
              if str(payload.get("code")) not in ("0", "200"):
                  sys.exit(1)
          except Exception:
              pass
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: morning-report
          path: reports/
